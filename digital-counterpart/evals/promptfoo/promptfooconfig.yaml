description: Digital Counterpart model and endpoint regression suite

prompts:
  - "{{question}}"

providers:
  - id: "http://localhost:3000/api/chat"
    config:
      method: POST
      headers:
        Content-Type: application/json
      body:
        messages:
          - id: promptfoo-user
            role: user
            parts:
              - type: text
                text: "{{prompt}}"

defaultTest:
  options:
    provider: openai:gpt-4.1-2025-04-14

tests: file://tests/critical.yaml
